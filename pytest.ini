[pytest]
testpaths = python/tests
# -ra lists every skip and xfail with its reason. Pass -s -vv on the command
# line when you want them; `just test-py` does.
addopts = -ra
# strict_config, strict_markers, strict_xfail, strict_parametrization_ids.
strict = true
# A new warning fails the run. Silence a known one here with its reason.
filterwarnings =
    error
    # The test JWT secrets are short on purpose. Key strength is not under test.
    ignore::jwt.warnings.InsecureKeyLengthWarning
norecursedirs = ignore
markers =
    server_integration: exercises runbolt or real TCP server behavior.
    platform_smoke: small real-server smoke coverage that is safe for CI smoke jobs.
    artifact_smoke: validates installed wheel or sdist artifacts in isolated virtual environments.
    postgres: needs a PostgreSQL server; set DJANGO_BOLT_TEST_POSTGRES_DSN, or run `just test-pg`.
