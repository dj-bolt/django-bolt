name: CI

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Supported Python versions, parsed from the pyproject.toml classifiers
  python-versions:
    name: Read Python versions from pyproject.toml
    runs-on: ubuntu-latest
    outputs:
      # GIL builds only (one abi3 wheel covers them all).
      versions-json: ${{ steps.extract.outputs.versions-json }}
      # GIL builds plus the free-threaded builds (3.14t, ...): the test matrix
      # and the wheel `--interpreter` list. Free-threaded builds are emitted
      # only while the "Free Threading" classifier is present.
      test-versions-json: ${{ steps.extract.outputs.test-versions-json }}
      interpreters: ${{ steps.extract.outputs.interpreters }}
      # Oldest, newest, and newest free-threaded: the server-integration matrix.
      integration-versions-json: ${{ steps.extract.outputs.integration-versions-json }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Extract supported versions from classifiers
        id: extract
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          import tomllib

          with open("pyproject.toml", "rb") as f:
              classifiers = tomllib.load(f)["project"]["classifiers"]
          prefix = "Programming Language :: Python :: 3."
          versions = sorted(
              (c.removeprefix("Programming Language :: Python :: ") for c in classifiers if c.startswith(prefix)),
              key=lambda v: tuple(map(int, v.split("."))),
          )
          assert versions, "no 'Programming Language :: Python :: 3.X' classifiers in pyproject.toml"
          # CPython supports free threading from 3.14; PyO3 0.29 dropped 3.13t.
          free_threaded = (
              [f"{v}t" for v in versions if tuple(map(int, v.split("."))) >= (3, 14)]
              if any(c.startswith("Programming Language :: Python :: Free Threading") for c in classifiers)
              else []
          )
          print(f"versions-json={json.dumps(versions)}")
          print(f"test-versions-json={json.dumps(versions + free_threaded)}")
          print(f"interpreters={' '.join(versions + free_threaded)}")
          print(f"integration-versions-json={json.dumps([versions[0], versions[-1], *free_threaded[-1:]])}")
          EOF

  # Run tests across Python versions
  test:
    name: Test Python ${{ matrix.python-version }} / Django ${{ matrix.django-version }}
    runs-on: ubuntu-latest
    needs: python-versions
    strategy:
      fail-fast: false
      matrix:
        # Includes the free-threaded builds (e.g. 3.14t): `uv python install`
        # resolves the "t" suffix, and maturin builds a cp314t module for it.
        python-version: ${{ fromJSON(needs.python-versions.outputs.test-versions-json) }}
        # Newest supported Django on every Python; older Django series on the
        # newest Python each of them supports (see pyproject classifiers).
        django-version: ["6.1"]
        include:
          - { python-version: "3.12", django-version: "4.2" }
          - { python-version: "3.12", django-version: "5.0" }
          - { python-version: "3.13", django-version: "5.1" }
          - { python-version: "3.13", django-version: "5.2" }
          - { python-version: "3.14", django-version: "6.0" }

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "latest"

      - name: Set up Python
        run: |
          uv python install ${{ matrix.python-version }}
          uv venv

      - name: Install Rust
        # Toolchain (channel + rustfmt) comes from rust-toolchain.toml — omit
        # `toolchain` so the action reads the file. Default rust-cache is safe to
        # share across the Python matrix: the abi3 build is version-agnostic
        # (one artifact for 3.12/3.13/3.14), so cached deps are identical. The
        # free-threaded entry (3.14t) is a separate cp314t build; PyO3 keys its
        # config on the interpreter, so a shared cache only costs a rebuild of
        # the PyO3 crates.
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          rustflags: "" # action defaults to -D warnings; don't block tests on warnings

      - name: Install dependencies
        # One explicit sync (dev group pins the newest Django), then swap in the
        # matrix Django. Every later `uv run` is --no-sync so the lockfile's
        # Django is not reinstalled over it.
        run: |
          uv sync --all-extras
          uv pip install "django~=${{ matrix.django-version }}.0"
          uv run --no-sync python -c "import django; print('Django', django.__version__)"

      - name: Build extension
        run: uv run --no-sync maturin develop --release

      - name: Run tests
        run: uv run --no-sync --with pytest pytest python/tests -m "not server_integration and not artifact_smoke" -s -vv

      # Separate invocation: bolt-mcp's conftest configures Django (OAuth app,
      # file-backed sqlite) incompatibly with the main suite's settings.
      - name: Run bolt-mcp tests
        run: uv run --no-sync --with pytest pytest python/bolt-mcp/tests -m "not server_integration and not artifact_smoke" -s -vv

  server_smoke_linux:
    name: Server Smoke Linux
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Create virtual environment
        run: uv venv

      - name: Install Rust
        # Toolchain (channel + rustfmt) comes from rust-toolchain.toml — omit
        # `toolchain` so the action reads the file. Default rust-cache is safe to
        # share across the Python matrix: the abi3 build is version-agnostic
        # (one artifact for 3.12/3.13/3.14), so cached deps are identical. The
        # free-threaded entry (3.14t) is a separate cp314t build; PyO3 keys its
        # config on the interpreter, so a shared cache only costs a rebuild of
        # the PyO3 crates.
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          rustflags: "" # action defaults to -D warnings; don't block tests on warnings

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Build extension
        run: uv run maturin develop --release

      - name: Run platform smoke tests
        run: uv run pytest python/tests/integration -m platform_smoke -s -vv

  server_integration_linux:
    name: Server Integration Linux Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: python-versions
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.python-versions.outputs.integration-versions-json) }}
    # The dead-connection recovery tests (`-m postgres`) skip without a DSN,
    # so the service is what keeps that fix from regressing in silence.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_BOLT_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create virtual environment
        run: uv venv

      - name: Install Rust
        # Toolchain (channel + rustfmt) comes from rust-toolchain.toml — omit
        # `toolchain` so the action reads the file. Default rust-cache is safe to
        # share across the Python matrix: the abi3 build is version-agnostic
        # (one artifact for 3.12/3.13/3.14), so cached deps are identical. The
        # free-threaded entry (3.14t) is a separate cp314t build; PyO3 keys its
        # config on the interpreter, so a shared cache only costs a rebuild of
        # the PyO3 crates.
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          rustflags: "" # action defaults to -D warnings; don't block tests on warnings

      - name: Install dependencies
        run: uv pip install -e ".[dev]" -e python/bolt-mcp

      - name: Build extension
        run: uv run maturin develop --release

      - name: Run server integration tests
        run: uv run pytest python/tests/integration -m "server_integration and not artifact_smoke" -s -vv

      - name: Run bolt-mcp server integration tests
        run: uv run pytest python/bolt-mcp/tests/integration -m "server_integration and not artifact_smoke" -s -vv

  platform_smoke:
    name: Platform Smoke ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-latest", "windows-latest"]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Create virtual environment
        run: uv venv

      - name: Install Rust
        # Toolchain (channel + rustfmt) comes from rust-toolchain.toml — omit
        # `toolchain` so the action reads the file. Default rust-cache is safe to
        # share across the Python matrix: the abi3 build is version-agnostic
        # (one artifact for 3.12/3.13/3.14), so cached deps are identical. The
        # free-threaded entry (3.14t) is a separate cp314t build; PyO3 keys its
        # config on the interpreter, so a shared cache only costs a rebuild of
        # the PyO3 crates.
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          rustflags: "" # action defaults to -D warnings; don't block tests on warnings

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Build extension
        run: uv run maturin develop --release

      - name: Run platform smoke tests
        run: uv run pytest python/tests/integration -m platform_smoke -s -vv

  # Build wheels for Linux x86_64 (covers most Linux users including Arch)
  linux-amd64:
    name: Build wheels on Linux x86_64
    runs-on: ubuntu-latest
    needs: python-versions

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          docker system prune -af
          docker volume prune -f

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: x86_64
          args: --release --out dist --interpreter ${{ needs.python-versions.outputs.interpreters }}
          sccache: "true"
          manylinux: auto
          docker-options: --pull always

      - name: Upload wheels
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wheels-linux-x86_64
          path: dist

  # Build wheels for Linux arm64
  linux-arm64:
    name: Build wheels on Linux ARM
    runs-on: ubuntu-24.04-arm
    needs: python-versions

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          docker system prune -af
          docker volume prune -f

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: aarch64
          args: --release --out dist --interpreter ${{ needs.python-versions.outputs.interpreters }}
          sccache: "true"
          manylinux: auto
          docker-options: --pull always

      - name: Upload wheels
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wheels-linux-aarch64
          path: dist

  # Build wheels for macOS
  macos:
    name: Build wheels on macOS
    runs-on: macos-latest
    needs: python-versions

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up free-threaded Python
        # The GIL interpreters come from the runner tool cache; the
        # free-threaded one (python3.14t) must be installed for maturin to find.
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14t"

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: universal2-apple-darwin
          args: --release --out dist --interpreter ${{ needs.python-versions.outputs.interpreters }}
          sccache: "true"

      - name: Upload wheels
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wheels-macos-universal2
          path: dist

  # Build wheels for Windows
  windows:
    name: Build wheels on Windows
    runs-on: windows-latest
    needs: python-versions

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up free-threaded Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14t"

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: x64
          args: --release --out dist --interpreter ${{ needs.python-versions.outputs.interpreters }}
          sccache: "true"

      - name: Upload wheels
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wheels-windows-x64
          path: dist

  # Build source distribution
  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          docker system prune -af
          docker volume prune -f

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wheels-sdist
          path: dist

  # Validate all wheels
  validate:
    name: Validate wheels
    runs-on: ubuntu-latest
    needs: [linux-amd64,linux-arm64, macos, windows, sdist]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Install twine
        run: pip install twine

      - name: Check wheels with twine
        run: twine check --strict dist/*

      - name: List all wheels
        run: ls -lh dist/

  # Supply-chain gate: a vulnerable dep compiled into the wheel (Rust) or
  # resolved at install (Python) passes manual release review. This catches it;
  # it blocks release via `needs` below.
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          rustflags: ""

      - name: cargo audit (Rust deps in Cargo.lock)
        run: |
          cargo install cargo-audit --locked
          # RUSTSEC-2026-0258 (h2 unbounded empty DATA frames): the patch is in
          # h2 0.4.16, but the 0.3 line has no backport. h2 is transitive via
          # actix-http, which needs h2 0.3, so actix-web 4.x cannot reach the
          # patched release. Low severity, and it needs HTTP/2. Remove this
          # ignore when actix-web moves to h2 0.4.
          cargo audit --ignore RUSTSEC-2026-0258

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "latest"

      - name: pip-audit (Python deps in uv.lock)
        run: |
          uv export --no-emit-project --no-dev --format requirements-txt --output-file audit-reqs.txt
          uvx pip-audit --requirement audit-reqs.txt --no-deps

  artifact_smoke:
    name: Artifact Smoke ${{ matrix.artifact-kind }} Python ${{ matrix.python-version }}
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [linux-amd64, sdist]
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact-kind: wheel
            python-version: "3.13"
            artifact-pattern: "django_bolt-*-abi3-*.whl"
          - artifact-kind: wheel
            python-version: "3.14t"
            artifact-pattern: "django_bolt-*-cp314-cp314t-*.whl"
          - artifact-kind: sdist
            python-version: "3.13"
            artifact-pattern: "django_bolt-*.tar.gz"

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create virtual environment
        run: uv venv --python "${{ matrix.python-version }}"

      - name: Install Rust
        # Toolchain (channel + rustfmt) comes from rust-toolchain.toml — omit
        # `toolchain` so the action reads the file. Default rust-cache is safe to
        # share across the Python matrix: the abi3 build is version-agnostic
        # (one artifact for 3.12/3.13/3.14), so cached deps are identical. The
        # free-threaded entry (3.14t) is a separate cp314t build; PyO3 keys its
        # config on the interpreter, so a shared cache only costs a rebuild of
        # the PyO3 crates.
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          rustflags: "" # action defaults to -D warnings; don't block tests on warnings

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Build extension
        run: uv run maturin develop --release

      - name: Download Linux wheel artifact
        if: matrix.artifact-kind == 'wheel'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: wheels-linux-x86_64
          path: dist

      - name: Download source artifact
        if: matrix.artifact-kind == 'sdist'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: wheels-sdist
          path: dist

      - name: Resolve artifact path
        id: artifact
        shell: bash
        env:
          ARTIFACT_PATTERN: ${{ matrix.artifact-pattern }}
        run: |
          mapfile -t artifacts < <(find dist -maxdepth 1 -name "$ARTIFACT_PATTERN" -type f)
          if [ "${#artifacts[@]}" -ne 1 ]; then
            echo "Expected one artifact matching $ARTIFACT_PATTERN; found ${#artifacts[@]}" >&2
            exit 1
          fi
          echo "path=${artifacts[0]}" >> "$GITHUB_OUTPUT"

      - name: Run artifact smoke tests
        env:
          DJANGO_BOLT_ARTIFACT_PATH: ${{ steps.artifact.outputs.path }}
        run: uv run pytest python/tests/integration/test_artifact_smoke.py -m artifact_smoke -s -vv

  # Release to PyPI
  release:
    name: Release to PyPI
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, validate, audit, server_smoke_linux, server_integration_linux, platform_smoke, artifact_smoke]
    environment:
      name: pypi
      url: https://pypi.org/project/django-bolt/
    permissions:
      id-token: write # Required for trusted publishing
      contents: write # Required for GitHub release

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Install uv
        run: pip install uv

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
