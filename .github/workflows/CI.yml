name: CI

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One group per pull request: a new push cancels the run for the old commit.
# Each other run (master, tags, by hand) gets a group of its own. GitHub cancels
# a run that waits in a shared group when a newer run comes, so a shared group
# could drop a master run. A release run always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Find if a pull request changes documentation only. Such a pull request
  # skips the build and test jobs. The ci-ok job reports one result for all.
  # Other events (push, tag, workflow_dispatch) always run the full pipeline.
  changes:
    name: Detect doc-only changes
    runs-on: ubuntu-latest
    outputs:
      # "true" when every changed file is documentation.
      docs-only: ${{ steps.classify.outputs.docs-only }}
      # "true" when docs/ or the docs toolchain changed. This starts the
      # docs build.
      docs: ${{ steps.classify.outputs.docs }}
    steps:
      # The pull_request checkout is the test merge commit. Depth 2 also
      # fetches its first parent, the tip of the base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Classify the changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Event $EVENT_NAME always runs the full pipeline."
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Documentation is docs/** and each *.md file, with two exceptions.
          # The package readmes are build inputs: `twine check` in the
          # validate job renders README.md, and the bolt-mcp build reads
          # python/bolt-mcp/README.md. No other build step or test reads a
          # Markdown file.
          is_doc() {
            case "$1" in
              README.md | python/bolt-mcp/README.md) return 1 ;;
              docs/* | *.md) return 0 ;;
              *) return 1 ;;
            esac
          }

          # --no-renames lists the old and the new path of a moved file.
          total=0
          code=0
          docs=false
          {
            echo "### Changed files"
            echo
            echo "| File | Class |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r -d '' file; do
            total=$((total + 1))
            if is_doc "$file"; then
              class=doc
            else
              class=code
              code=$((code + 1))
            fi
            # uv.lock and pyproject.toml pin the docs toolchain.
            case "$file" in docs/* | uv.lock | pyproject.toml) docs=true ;; esac
            echo "$class  $file"
            echo "| \`$file\` | $class |" >> "$GITHUB_STEP_SUMMARY"
          done < <(git diff --name-only --no-renames -z HEAD^1 HEAD)

          # An empty diff is not doc-only, so it runs the full pipeline.
          if [ "$total" -gt 0 ] && [ "$code" -eq 0 ]; then
            docs_only=true
          else
            docs_only=false
          fi
          echo "files=$total code=$code docs-only=$docs_only docs=$docs"
          printf '\ndocs-only=%s, docs=%s\n' "$docs_only" "$docs" >> "$GITHUB_STEP_SUMMARY"
          echo "docs-only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"

  # Supported Python versions, parsed from the pyproject.toml classifiers.
  # A doc-only pull request skips this job. Each job that needs it then skips
  # too: test, server_smoke_linux, server_integration_linux, and the wheels.
  python-versions:
    name: Read Python versions from pyproject.toml
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    outputs:
      # GIL builds only (one abi3 wheel covers them all).
      versions-json: ${{ steps.extract.outputs.versions-json }}
      # GIL builds plus the free-threaded builds (3.14t, ...): the test matrix
      # and the wheel `--interpreter` list. Free-threaded builds are emitted
      # only while the "Free Threading" classifier is present.
      test-versions-json: ${{ steps.extract.outputs.test-versions-json }}
      # One wheel build per entry: the abi3 wheel, and one per free-threaded
      # interpreter. The wheel jobs build them in parallel.
      wheel-builds-json: ${{ steps.extract.outputs.wheel-builds-json }}
      # Oldest, newest, and newest free-threaded: the server-integration matrix.
      integration-versions-json: ${{ steps.extract.outputs.integration-versions-json }}
      # Newest GIL build and newest free-threaded build: the Rust job matrix.
      rust-versions-json: ${{ steps.extract.outputs.rust-versions-json }}
      # Oldest and newest supported Python, for the jobs that need exactly one
      # interpreter rather than a matrix. Derived so no job hardcodes a version
      # that could fall out of the supported set unnoticed.
      oldest-version: ${{ steps.extract.outputs.oldest-version }}
      newest-version: ${{ steps.extract.outputs.newest-version }}
      # The wheel file pattern for each test interpreter: abi3 for a GIL build,
      # cpXY-cpXYt for a free-threaded build. install-built-wheel and the
      # artifact smoke both use it, so the naming rule is only here.
      wheel-patterns-json: ${{ steps.extract.outputs.wheel-patterns-json }}
      # The whole artifact-smoke include list. Generated here so each entry's
      # wheel pattern is derived from its interpreter and the two cannot drift.
      artifact-include-json: ${{ steps.extract.outputs.artifact-include-json }}
      # Newest supported Django series: the base django-version axis.
      django-newest-json: ${{ steps.extract.outputs.django-newest-json }}
      # Older supported Django series, each pinned to the oldest supported
      # Python: extra `include` entries for the test matrix.
      django-include-json: ${{ steps.extract.outputs.django-include-json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract supported versions from classifiers
        id: extract
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          import tomllib

          with open("pyproject.toml", "rb") as f:
              classifiers = tomllib.load(f)["project"]["classifiers"]
          prefix = "Programming Language :: Python :: 3."
          versions = sorted(
              (c.removeprefix("Programming Language :: Python :: ") for c in classifiers if c.startswith(prefix)),
              key=lambda v: tuple(map(int, v.split("."))),
          )
          assert versions, "no 'Programming Language :: Python :: 3.X' classifiers in pyproject.toml"
          # CPython supports free threading from 3.14; PyO3 0.29 dropped 3.13t.
          free_threaded = (
              [f"{v}t" for v in versions if tuple(map(int, v.split("."))) >= (3, 14)]
              if any(c.startswith("Programming Language :: Python :: Free Threading") for c in classifiers)
              else []
          )
          print(f"versions-json={json.dumps(versions)}")
          print(f"test-versions-json={json.dumps(versions + free_threaded)}")
          # abi3 needs only the oldest GIL interpreter: one wheel covers the rest.
          wheel_builds = [{"name": "abi3", "interpreter": versions[0]}]
          wheel_builds += [{"name": "cp" + v.replace(".", ""), "interpreter": v} for v in free_threaded]
          print(f"wheel-builds-json={json.dumps(wheel_builds)}")
          print(f"integration-versions-json={json.dumps([versions[0], versions[-1], *free_threaded[-1:]])}")
          print(f"rust-versions-json={json.dumps([versions[-1], *free_threaded[-1:]])}")
          print(f"oldest-version={versions[0]}")
          print(f"newest-version={versions[-1]}")

          def wheel_pattern(version):
              # A GIL build uses the abi3 wheel. A free-threaded build uses its
              # own cp3XX-cp3XXt wheel.
              if version.endswith("t"):
                  tag = "cp" + version.removesuffix("t").replace(".", "")
                  return f"django_bolt-*-{tag}-{tag}t-*.whl"
              return "django_bolt-*-abi3-*.whl"

          print(f"wheel-patterns-json={json.dumps({v: wheel_pattern(v) for v in versions + free_threaded})}")

          # Artifact smoke: the abi3 wheel and the sdist install on the oldest
          # supported Python, since that is what the abi3 tag and
          # requires-python claim. Each free-threaded build gets its own
          # cp3XX-cp3XXt wheel, whose pattern is derived from the interpreter.
          artifacts = [
              {
                  "artifact-kind": "wheel",
                  "python-version": v,
                  "artifact-pattern": wheel_pattern(v),
              }
              for v in [versions[0], *free_threaded]
          ]
          artifacts.append(
              {
                  "artifact-kind": "sdist",
                  "python-version": versions[0],
                  "artifact-pattern": "django_bolt-*.tar.gz",
              }
          )
          print(f"artifact-include-json={json.dumps(artifacts)}")

          # Django series, same source of truth. Only upstream-supported series
          # are listed (see scripts/check_support_matrix.py), and every one of
          # them supports every Python above -- so the newest Django runs on all
          # Pythons and each older series runs on the oldest Python.
          django_prefix = "Framework :: Django :: "
          django = sorted(
              (c.removeprefix(django_prefix) for c in classifiers if c.startswith(django_prefix) and c != "Framework :: Django"),
              key=lambda v: tuple(map(int, v.split("."))),
          )
          assert django, "no 'Framework :: Django :: X.Y' classifiers in pyproject.toml"
          print(f"django-newest-json={json.dumps(django[-1:])}")
          print(
              "django-include-json="
              + json.dumps([{"python-version": versions[0], "django-version": d} for d in django[:-1]])
          )
          EOF

  # Run tests across Python versions
  test:
    name: Test Python ${{ matrix.python-version }} / Django ${{ matrix.django-version }}
    runs-on: ubuntu-latest
    needs: [python-versions, linux-amd64]
    strategy:
      fail-fast: false
      matrix:
        # Includes the free-threaded builds (e.g. 3.14t): `uv python install`
        # resolves the "t" suffix, and linux-amd64 builds a cp314t wheel for it.
        python-version: ${{ fromJSON(needs.python-versions.outputs.test-versions-json) }}
        # Newest supported Django on every Python; each older series once on the
        # oldest Python. Both derived from the pyproject classifiers, so dropping
        # or adding a Django series needs no change here.
        django-version: ${{ fromJSON(needs.python-versions.outputs.django-newest-json) }}
        include: ${{ fromJSON(needs.python-versions.outputs.django-include-json) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest"

      - name: Set up Python
        run: |
          uv python install ${{ matrix.python-version }}
          uv venv --python ${{ matrix.python-version }}

      - name: Install dependencies
        # One explicit sync (dev group pins the newest Django), then swap in the
        # matrix Django. Every later `uv run` is --no-sync so the lockfile's
        # Django is not reinstalled over it. --no-install-project: installing
        # the project would build the Rust extension.
        run: |
          uv sync --all-extras --no-install-project
          uv pip install "django~=${{ matrix.django-version }}.0"
          uv run --no-sync python -c "import django; print('Django', django.__version__)"

      # No Rust build: install the release wheel of the linux-amd64 job.
      - name: Install the built wheel
        uses: ./.github/actions/install-built-wheel
        with:
          artifacts: wheels-linux-x86_64-*
          wheel-pattern: ${{ fromJSON(needs.python-versions.outputs.wheel-patterns-json)[matrix.python-version] }}

      - name: Run tests
        run: uv run --no-sync pytest python/tests -m "not server_integration and not artifact_smoke" -n auto -v

      # Separate invocation: bolt-mcp's conftest configures Django (OAuth app,
      # file-backed sqlite) incompatibly with the main suite's settings.
      - name: Run bolt-mcp tests
        run: uv run --no-sync pytest python/bolt-mcp/tests -m "not server_integration and not artifact_smoke" -v

  rust:
    name: Rust tests and clippy Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: python-versions
    strategy:
      fail-fast: false
      matrix:
        # A free-threaded interpreter compiles the #[cfg(Py_GIL_DISABLED)]
        # code, and a GIL build compiles the rest. Lint and test both.
        python-version: ${{ fromJSON(needs.python-versions.outputs.rust-versions-json) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The PyO3 crates link libpython in test builds.
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # PyO3 builds against PYO3_PYTHON. Set it, so that the build cannot pick
      # another python3 from PATH.
      - name: Select the interpreter for PyO3
        env:
          PYTHON_PATH: ${{ steps.setup-python.outputs.python-path }}
        run: echo "PYO3_PYTHON=$PYTHON_PATH" >> "$GITHUB_ENV"

      - name: Install Rust
        # Toolchain (channel + rustfmt + clippy) comes from rust-toolchain.toml.
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          # Clippy below runs with `-D warnings`; the build itself keeps
          # warnings as warnings, like the other jobs.
          build-warnings: ""

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

  server_smoke_linux:
    name: Server Smoke Linux
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [python-versions, linux-amd64]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.python-versions.outputs.newest-version }}

      - name: Create virtual environment
        run: uv venv --python ${{ needs.python-versions.outputs.newest-version }}

      # --no-install-project: installing the project would build the Rust
      # extension. The dependencies and the bolt-mcp workspace member install.
      - name: Install dependencies
        run: uv sync --all-extras --no-install-project

      # No Rust build: install the release wheel of the linux-amd64 job.
      - name: Install the built wheel
        uses: ./.github/actions/install-built-wheel
        with:
          artifacts: wheels-linux-x86_64-*
          wheel-pattern: ${{ fromJSON(needs.python-versions.outputs.wheel-patterns-json)[needs.python-versions.outputs.newest-version] }}

      - name: Run platform smoke tests
        run: uv run --no-sync pytest python/tests/integration -m platform_smoke -v

  server_integration_linux:
    name: Server Integration Linux Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: [python-versions, linux-amd64]
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.python-versions.outputs.integration-versions-json) }}
    # The PostgreSQL tests (`-m postgres`: dead-connection recovery and the
    # django-tenants request lanes) skip without a DSN, so the service is what
    # keeps those fixes from regressing in silence.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_BOLT_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create virtual environment
        run: uv venv --python ${{ matrix.python-version }}

      # --no-install-project: installing the project would build the Rust
      # extension. The dependencies and the bolt-mcp workspace member install.
      - name: Install dependencies
        run: uv sync --all-extras --no-install-project

      # No Rust build: install the release wheel of the linux-amd64 job.
      - name: Install the built wheel
        uses: ./.github/actions/install-built-wheel
        with:
          artifacts: wheels-linux-x86_64-*
          wheel-pattern: ${{ fromJSON(needs.python-versions.outputs.wheel-patterns-json)[matrix.python-version] }}

      # Each test starts its own server on a free port, and each PostgreSQL
      # test makes its own database, so the tests run in parallel.
      - name: Run server integration tests
        run: uv run --no-sync pytest python/tests/integration -m "server_integration and not artifact_smoke" -n auto --dist loadfile -v

      - name: Run bolt-mcp server integration tests
        run: uv run --no-sync pytest python/bolt-mcp/tests/integration -m "server_integration and not artifact_smoke" -v

  platform_smoke:
    name: Platform Smoke ${{ matrix.os }}
    # The release needs this job. Run the workflow by hand (workflow_dispatch)
    # to test a change to it before a tag.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    needs: [python-versions, macos, windows]
    strategy:
      fail-fast: false
      matrix:
        # Each runner installs the wheel that ships for it.
        include:
          - os: macos-latest
            wheels: wheels-macos-arm64-*
          - os: windows-latest
            wheels: wheels-windows-x64-*

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.python-versions.outputs.newest-version }}

      - name: Create virtual environment
        run: uv venv --python ${{ needs.python-versions.outputs.newest-version }}

      # --no-install-project: installing the project would build the Rust
      # extension. The dependencies and the bolt-mcp workspace member install.
      - name: Install dependencies
        run: uv sync --all-extras --no-install-project

      # No Rust build: install the release wheel that ships for this runner.
      - name: Install the built wheel
        uses: ./.github/actions/install-built-wheel
        with:
          artifacts: ${{ matrix.wheels }}
          wheel-pattern: ${{ fromJSON(needs.python-versions.outputs.wheel-patterns-json)[needs.python-versions.outputs.newest-version] }}

      # psycopg (a dev dependency) loads libpq when a test module imports it.
      # The macOS image has no libpq, and Homebrew's libpq is keg-only. ctypes
      # finds a library in /usr/local/lib, so link it there. DYLD_* variables
      # do not reach the tests: macOS removes them when it starts /bin/bash.
      - name: Install libpq (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libpq
          sudo mkdir -p /usr/local/lib
          sudo ln -sf "$(brew --prefix libpq)"/lib/libpq*.dylib /usr/local/lib/
          uv run --no-sync python -c "import psycopg; print('libpq', psycopg.pq.version())"

      - name: Run platform smoke tests
        run: uv run --no-sync pytest python/tests/integration -m platform_smoke -v

  # Build wheels for Linux x86_64 (covers most Linux users including Arch)
  linux-amd64:
    name: Build wheels on Linux x86_64 (${{ matrix.build.name }})
    runs-on: ubuntu-latest
    needs: python-versions
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.python-versions.outputs.wheel-builds-json) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          docker system prune -af
          docker volume prune -f

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: x86_64
          args: --release --out dist --interpreter ${{ matrix.build.interpreter }}
          sccache: "true"
          manylinux: auto
          docker-options: --pull always

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-linux-x86_64-${{ matrix.build.name }}
          path: dist

  # Build wheels for Linux arm64
  linux-arm64:
    name: Build wheels on Linux ARM (${{ matrix.build.name }})
    runs-on: ubuntu-24.04-arm
    needs: python-versions
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.python-versions.outputs.wheel-builds-json) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          docker system prune -af
          docker volume prune -f

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: aarch64
          args: --release --out dist --interpreter ${{ matrix.build.interpreter }}
          sccache: "true"
          manylinux: auto
          docker-options: --pull always

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-linux-aarch64-${{ matrix.build.name }}
          path: dist

  # Build wheels for macOS. The Apple silicon runner also cross-builds the
  # Intel wheel, as the universal2 build did before.
  macos:
    name: Build wheels on macOS ${{ matrix.platform.arch }} (${{ matrix.build.name }})
    runs-on: macos-latest
    needs: python-versions
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.python-versions.outputs.wheel-builds-json) }}
        platform:
          - { arch: arm64, target: aarch64-apple-darwin }
          - { arch: x86_64, target: x86_64-apple-darwin }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # setup-python gives one interpreter path. maturin can find the same
      # interpreter under two names and then builds the wheel twice.
      - name: Set up Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.build.interpreter }}

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter ${{ steps.python.outputs.python-path }}
          sccache: "true"

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-macos-${{ matrix.platform.arch }}-${{ matrix.build.name }}
          path: dist

  # Build wheels for Windows
  windows:
    name: Build wheels on Windows (${{ matrix.build.name }})
    runs-on: windows-latest
    needs: python-versions
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.python-versions.outputs.wheel-builds-json) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # setup-python gives one interpreter path. maturin found the
      # free-threaded interpreter under two names and built its wheel twice.
      - name: Set up Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.build.interpreter }}

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: x64
          args: --release --out dist --interpreter ${{ steps.python.outputs.python-path }}
          sccache: "true"

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-windows-x64-${{ matrix.build.name }}
          path: dist

  # Build source distribution
  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          docker system prune -af
          docker volume prune -f

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: dist

  # Validate all wheels
  validate:
    name: Validate wheels
    runs-on: ubuntu-latest
    needs: [python-versions, linux-amd64, linux-arm64, macos, windows, sdist]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # One directory per artifact. A merged directory would hide a missing
      # wheel, or a wheel that two artifacts hold.
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: artifacts

      - name: Check that each platform has each wheel build
        env:
          WHEEL_BUILDS: ${{ needs.python-versions.outputs.wheel-builds-json }}
        run: |
          python3 - <<'EOF'
          import json
          import os
          import re
          from pathlib import Path

          # The platform part of each artifact name, and the platform tag of its wheel.
          platforms = {
              "linux-x86_64": r"manylinux\S*_x86_64",
              "linux-aarch64": r"manylinux\S*_aarch64",
              "macos-arm64": r"macosx_\d+_\d+_arm64",
              "macos-x86_64": r"macosx_\d+_\d+_x86_64",
              "windows-x64": r"win_amd64",
          }
          builds = json.loads(os.environ["WHEEL_BUILDS"])
          root = Path("artifacts")
          errors = []

          def files_in(name):
              directory = root / name
              return sorted(path.name for path in directory.iterdir()) if directory.is_dir() else []

          expected = {f"wheels-{platform}-{build['name']}" for platform in platforms for build in builds}
          expected.add("wheels-sdist")
          found = {path.name for path in root.iterdir() if path.is_dir()}
          errors += [f"missing artifact {name}" for name in sorted(expected - found)]
          errors += [f"unexpected artifact {name}" for name in sorted(found - expected)]

          for platform, platform_pattern in platforms.items():
              for build in builds:
                  name = f"wheels-{platform}-{build['name']}"
                  files = files_in(name)
                  if len(files) != 1 or not files[0].endswith(".whl"):
                      errors.append(f"{name}: expected one wheel, found {files}")
                      continue
                  # {distribution}-{version}-{python tag}-{abi tag}-{platform tag}.whl
                  python_tag, abi_tag, platform_tag = files[0].removesuffix(".whl").split("-")[-3:]
                  if build["name"] == "abi3":
                      tags_ok = abi_tag == "abi3" and python_tag == "cp" + build["interpreter"].replace(".", "")
                  else:
                      tags_ok = abi_tag == build["name"] and python_tag == build["name"].removesuffix("t")
                  if not tags_ok:
                      errors.append(f"{name}: {files[0]} has the wrong Python or ABI tag")
                  if not re.fullmatch(platform_pattern, platform_tag):
                      errors.append(f"{name}: {files[0]} has the wrong platform tag")

          sdist = files_in("wheels-sdist")
          if len(sdist) != 1 or not sdist[0].endswith(".tar.gz"):
              errors.append(f"wheels-sdist: expected one .tar.gz, found {sdist}")

          for error in errors:
              print(f"::error::{error}")
          raise SystemExit(1 if errors else 0)
          EOF

      - name: Install twine
        run: pip install twine

      - name: Check wheels with twine
        run: twine check --strict artifacts/*/*

      - name: List all wheels
        run: ls -lhR artifacts/

  # Supply-chain gate: a vulnerable dep compiled into the wheel (Rust) or
  # resolved at install (Python) passes manual release review. This catches it;
  # it blocks release via `needs` below.
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          # v2 dropped the `-D warnings` RUSTFLAGS default and enforces
          # warning-free builds via CARGO_BUILD_WARNINGS (cargo 1.97+) instead,
          # defaulting it to "deny". Empty means "leave the variable unset", so
          # warnings stay warnings and don't block tests.
          build-warnings: ""

      - name: cargo audit (Rust deps in Cargo.lock)
        run: |
          cargo install cargo-audit --locked
          # RUSTSEC-2026-0258 (h2 unbounded empty DATA frames): the patch is in
          # h2 0.4.16, but the 0.3 line has no backport. h2 is transitive via
          # actix-http, which needs h2 0.3, so actix-web 4.x cannot reach the
          # patched release. Low severity, and it needs HTTP/2. Remove this
          # ignore when actix-web moves to h2 0.4.
          cargo audit --ignore RUSTSEC-2026-0258

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest"

      - name: pip-audit (Python deps in uv.lock)
        run: |
          uv export --no-emit-project --no-dev --format requirements-txt --output-file audit-reqs.txt
          uvx pip-audit --requirement audit-reqs.txt --no-deps

  artifact_smoke:
    name: Artifact Smoke ${{ matrix.artifact-kind }} Python ${{ matrix.python-version }}
    # The release needs this job. Run the workflow by hand (workflow_dispatch)
    # to test a change to it before a tag.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [linux-amd64, sdist, python-versions]
    strategy:
      fail-fast: false
      matrix:
        # Interpreter + matching wheel pattern for each artifact, generated
        # together by the python-versions job (see artifact-include-json).
        include: ${{ fromJSON(needs.python-versions.outputs.artifact-include-json) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create virtual environment
        run: uv venv --python "${{ matrix.python-version }}"

      # --no-install-project: installing the project would build the Rust
      # extension. The dependencies and the bolt-mcp workspace member install.
      - name: Install dependencies
        run: uv sync --all-extras --no-install-project

      # The test process needs django_bolt too. This step also puts the Linux
      # wheels in dist/ for the wheel artifact under test.
      - name: Install the built wheel
        uses: ./.github/actions/install-built-wheel
        with:
          artifacts: wheels-linux-x86_64-*
          wheel-pattern: ${{ fromJSON(needs.python-versions.outputs.wheel-patterns-json)[matrix.python-version] }}


      - name: Download source artifact
        if: matrix.artifact-kind == 'sdist'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheels-sdist
          path: dist

      - name: Resolve artifact path
        id: artifact
        shell: bash
        env:
          ARTIFACT_PATTERN: ${{ matrix.artifact-pattern }}
        run: |
          mapfile -t artifacts < <(find dist -maxdepth 1 -name "$ARTIFACT_PATTERN" -type f)
          if [ "${#artifacts[@]}" -ne 1 ]; then
            echo "Expected one artifact matching $ARTIFACT_PATTERN; found ${#artifacts[@]}" >&2
            exit 1
          fi
          echo "path=${artifacts[0]}" >> "$GITHUB_OUTPUT"

      - name: Run artifact smoke tests
        env:
          DJANGO_BOLT_ARTIFACT_PATH: ${{ steps.artifact.outputs.path }}
        run: uv run --no-sync pytest python/tests/integration/test_artifact_smoke.py -m artifact_smoke -v

  # Build the documentation site when a pull request changes docs/, uv.lock,
  # or pyproject.toml. This job only builds. The Documentation workflow
  # deploys on push to master.
  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest"

      # --only-group installs the locked docs group and not the project, so
      # the Rust extension does not build. This matches `just docs-build`.
      - name: Build llms-full.txt
        run: uv run --locked --only-group docs python build_llms_full.py
        working-directory: docs

      - name: Build the site
        run: uv run --locked --only-group docs zensical build --clean
        working-directory: docs

  # One check for branch protection. A skipped job reports one check under its
  # matrix template name, so a required matrix check never passes. This job
  # passes when each needed job succeeds or skips. It fails on each other
  # result, for example failure or cancelled.
  ci-ok:
    name: CI OK
    if: always()
    runs-on: ubuntu-latest
    needs:
      - changes
      - python-versions
      - test
      - rust
      - server_smoke_linux
      - server_integration_linux
      - platform_smoke
      - linux-amd64
      - linux-arm64
      - macos
      - windows
      - sdist
      - validate
      - audit
      - artifact_smoke
      - docs

    steps:
      - name: Check the results of the needed jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.value.result)  \(.key)"' <<< "$NEEDS"
          bad=$(jq '[.[] | select(.result != "success" and .result != "skipped")] | length' <<< "$NEEDS")
          if [ "$bad" -ne 0 ]; then
            echo "::error::$bad needed job(s) did not succeed or skip."
            exit 1
          fi

  # Release to PyPI
  release:
    name: Release to PyPI
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, rust, validate, audit, server_smoke_linux, server_integration_linux, platform_smoke, artifact_smoke]
    environment:
      name: pypi
      url: https://pypi.org/project/django-bolt/
    permissions:
      id-token: write # Required for trusted publishing
      contents: write # Required for GitHub release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Install uv
        run: pip install uv

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
