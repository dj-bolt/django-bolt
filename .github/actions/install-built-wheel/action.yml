name: Install a built wheel
description: >-
  Install a django-bolt wheel of a wheel job into the uv environment. The tests
  then run the release binary, and the job does not build Rust.
inputs:
  artifacts:
    description: The artifact name pattern of the wheel job, for example wheels-linux-x86_64-*.
    required: true
  wheel-pattern:
    description: >-
      The file pattern of the wheel for the interpreter of the environment.
      Take it from the wheel-patterns-json output of the python-versions job.
    required: true

runs:
  using: composite
  steps:
    - name: Download the wheels
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: ${{ inputs.artifacts }}
        merge-multiple: true
        path: dist

    - name: Install the wheel
      shell: bash
      env:
        WHEEL_PATTERN: ${{ inputs.wheel-pattern }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        wheels=(dist/$WHEEL_PATTERN)
        if [ "${#wheels[@]}" -ne 1 ]; then
          echo "Expected one wheel matching $WHEEL_PATTERN; found ${#wheels[@]}" >&2
          exit 1
        fi
        # The wheel installs the metadata and the entry points of the package.
        uv pip install --no-deps "${wheels[0]}"
        # pytest puts python/ first on sys.path, so the source tree shadows the
        # installed package. Copy the extension of the wheel into the source tree.
        # Python reads the wheel, so the step does not need unzip on Windows.
        uv run --no-sync python - "${wheels[0]}" <<'EOF'
        import sys
        import zipfile
        from pathlib import Path

        with zipfile.ZipFile(sys.argv[1]) as wheel:
            names = [name for name in wheel.namelist() if name.startswith("django_bolt/_core")]
            if not names:
                sys.exit(f"{sys.argv[1]} has no django_bolt/_core*")
            for name in names:
                target = Path("python/django_bolt") / Path(name).name
                target.write_bytes(wheel.read(name))
                print(target)
        EOF
