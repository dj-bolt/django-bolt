# Django-Bolt documentation site. Build: `just docs-build`. Serve: `just docs`.
# Read docs/STYLE.md before you add or change a page.

[project]
site_name = "Django-Bolt"
site_description = "Django-Bolt serves typed Django APIs from a Rust HTTP server. Keep your models, admin and auth. Run one command in production."
site_author = "Farhan Ali Raza"
docs_dir = "src"
repo_url = "https://github.com/dj-bolt/django-bolt"
repo_name = "dj-bolt/django-bolt"
edit_uri = "edit/master/docs/src/"
site_url = "https://bolt.farhana.li/"
copyright = "Copyright &copy; 2025–2026 Farhan Ali Raza. MIT License."

# The navigation follows Diátaxis: learn (tutorial), do (guides),
# look up (reference), understand (explanation).
nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    { "Introduction" = "intro/index.md" },
    { "Installation" = "intro/install.md" },
    { "Tutorial" = [
      { "1. Project and first route" = "tutorial/index.md" },
      { "2. Models and validation" = "tutorial/part-2.md" },
      { "3. Authentication" = "tutorial/part-3.md" },
      { "4. Tests and production" = "tutorial/part-4.md" },
    ]},
    { "Migrate from Ninja, DRF or FastAPI" = "topics/migrating.md" },
  ]},
  { "Guides" = [
    { "Basics" = [
      { "Routing" = "topics/routing.md" },
      { "Requests" = "topics/requests.md" },
      { "Responses" = "topics/responses.md" },
      { "Errors" = "topics/error-handling.md" },
    ]},
    { "Data" = [
      { "Serializers" = "topics/serializers.md" },
      { "Django ORM" = "topics/async-orm.md" },
      { "Pagination" = "topics/pagination.md" },
    ]},
    { "Structure" = [
      { "Class-based views" = "topics/class-based-views.md" },
      { "Dependencies" = "topics/dependencies.md" },
      { "Middleware" = "topics/middleware.md" },
      { "Lifespan" = "topics/lifespan.md" },
      { "Signals" = "topics/signals.md" },
    ]},
    { "Security" = [
      { "Authentication" = "topics/authentication.md" },
      { "Permissions" = "topics/permissions.md" },
      { "CORS" = "topics/cors.md" },
      { "Rate limiting" = "topics/rate-limiting.md" },
    ]},
    { "Real time" = [
      { "Server-sent events" = "topics/sse.md" },
      { "WebSocket" = "topics/websocket.md" },
    ]},
    { "API docs" = [
      { "OpenAPI" = "topics/openapi.md" },
    ]},
    { "Files" = [
      { "Static files" = "topics/static-files.md" },
      { "Media files" = "topics/media-files.md" },
    ]},
    { "Production" = [
      { "Deployment" = "topics/deployment.md" },
      { "Testing" = "topics/testing.md" },
      { "Logging" = "topics/logging.md" },
      { "Health checks" = "topics/health-checks.md" },
      { "Compression" = "topics/compression.md" },
    ]},
    { "Integrations" = [
      { "MCP servers" = "topics/mcp.md" },
      { "ASGI mounts" = "topics/asgi-mounts.md" },
      { "Debug toolbar" = "topics/debug-toolbar.md" },
      { "nanodjango" = "topics/nanodjango.md" },
      { "Native routes" = "topics/native-routes.md" },
    ]},
  ]},
  { "Reference" = [
    { "BoltAPI and Router" = "ref/api.md" },
    { "Request" = "ref/request.md" },
    { "Parameters" = "ref/params.md" },
    { "Responses" = "ref/responses.md" },
    { "Exceptions" = "ref/exceptions.md" },
    { "Serializers" = "ref/serializers.md" },
    { "Views" = "ref/views.md" },
    { "Authentication" = "ref/auth.md" },
    { "Middleware" = "ref/middleware.md" },
    { "Testing" = "ref/testing.md" },
    { "Settings" = "ref/settings.md" },
    { "runbolt" = "ref/runbolt.md" },
  ]},
  { "Explanation" = [
    { "How it works" = "architecture.md" },
    { "Benchmarks" = "benchmarks.md" },
    { "Comparison" = "comparison.md" },
    { "FAQ" = "faq.md" },
  ]},
]

extra_css = ["stylesheets/bolt.css"]
extra_javascript = ["javascripts/bolt.js"]

[project.theme]
custom_dir = "overrides"
logo = "images/bolt-logo.png"
favicon = "images/bolt-logo.png"
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Use the system theme"

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[project.theme.icon]
repo = "fontawesome/brands/github"
edit = "lucide/pencil"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/dj-bolt/django-bolt"
name = "Django-Bolt on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/django-bolt/"
name = "Django-Bolt on PyPI"

[[project.extra.social]]
icon = "fontawesome/brands/discord"
link = "https://discord.gg/4xErptXK82"
name = "Django-Bolt on Discord"

# Markdown extensions. These are the Zensical defaults, written out so that
# a reader of this file sees what the pages can use.
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
